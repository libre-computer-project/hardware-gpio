name: Check

# This site publishes through Pages' deploy-from-branch, not through a
# workflow, so nothing here deploys and nothing here can block a deploy. What
# it does is answer the one question a vendored file raises: has the shared
# shell kit been hand-edited in this repo, where the next sync would revert it?

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the vendored shell kit
        run: python3 tools/check-kit.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test the static board pages' renderer
        run: node tools/test-render.mjs
      # the pages are committed render output: a change to index.html or
      # data/ without a re-run leaves crawlers reading the old pins
      - name: The committed pages are current
        run: node tools/render.mjs && git diff --exit-code && test -z "$(git status --porcelain)"
