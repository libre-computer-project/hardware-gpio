<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Scripts from this site only, plus the inline theme snippet by its sha256
     (tools/check-kit.py recomputes it); data, styles and images same-origin,
     data: for the kit's logo. GitHub Pages sets no headers, so it is a meta. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-ACy4pj93O7g7s8NBZ36xdNPdeBUZ5qKl4pgUR78Pd7E='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libre Computer GPIO Pinout</title>
<meta name="description" content="Interactive GPIO pinout and pinmux reference for Libre Computer single-board computers.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/lc-kit.css">
<link rel="stylesheet" href="css/style.css">
<!-- Sets the theme before first paint, so a dark visitor never sees a white
     flash. Must stay inline and must stay ahead of the stylesheets; the copy
     is checked by tools/lc-ui-kit/sync.py against HEAD_SNIPPET in lc-kit.js. -->
<script>try{var p=localStorage.getItem("theme")||"auto";if(p==="dark"||(p==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}catch(e){}</script>
</head>
<body class="lc-doc">
<header class="lc-topbar">
  <div class="lc-brand">
    <a class="lc-brand-name" href="https://libre.computer">Libre Computer</a>
    <nav class="lc-sites" aria-label="Libre Computer sites">
      <a class="lc-site" href="https://education.libre.computer/">Education</a>
      <a class="lc-site" data-lc-site href="https://layout.hardware.libre.computer/">Layout</a>
      <a class="lc-site" href="/" aria-current="true">GPIO Pinout</a>
      <a class="lc-site" data-lc-site href="https://power.hardware.libre.computer/">Power</a>
      <a class="lc-site" href="https://memory.software.libre.computer/">Memory</a>
    </nav>
  </div>
  <div class="lc-controls">
    <label for="board-select">Board</label>
    <select id="board-select" aria-label="Select board"></select>
    <input id="search" type="search" placeholder="Search: GPIOX_12, I2C, pin 7, B4…" autocomplete="off" spellcheck="false" aria-label="Search by pad, function, pin or ball">
  </div>
</header>

<nav id="legend-bar" aria-label="Mux classes"><div id="legend"></div></nav>

<div id="board-flag-slot" hidden></div>

<main>
  <section id="diagram" aria-label="Pin headers"></section>
  <aside id="panel">
    <button id="sheet-close" type="button">Close &times;</button>
    <div id="pin-detail"></div>
  </aside>
  <!-- after #panel: style.css sizes the panel by `#diagram + #panel` -->
  <p id="pin-keys" hidden>The arrow keys move between pins; Enter opens one, Escape closes it.</p>
</main>

<footer class="lc-footer">
  Pin data from <a href="https://github.com/libre-computer-project/libretech-wiring-tool">libretech-wiring-tool</a> (MIT)
  &middot; Learn how it works: <a href="https://education.libre.computer/modules/io/">driving a pin, and the header's buses</a>
  &middot; <a href="https://libre.computer">libre.computer</a>
</footer>

<div id="tooltip" class="lc-tooltip" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
